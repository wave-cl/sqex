# sqex exchange server configuration.

# Address to listen on: host:port, a bare IP (default port 5400), or a bare port.
listen = "[::]:5400"

# This server's identity — a file holding a hex Ed25519 seed. Created on first
# run if absent (unless the path was given explicitly on the command line).
key_file = "/etc/sqex/host_key"

# Where the managed whitelist, the relay peers and the audit log are
# snapshotted. Omit to run memory-only (state is lost on restart).
#
# This file is the authority for everything an administrator changes at
# runtime. Both lists below only seed it, and only on a run that finds nothing
# already recorded for them.
state_file = "/var/lib/sqex/sqex.state"

# Administrators: base58 Ed25519 public keys permitted to issue signed admin
# commands. For a YubiKey admin this is the card's OpenPGP Authentication
# subkey. Change this list and send a `reload-admins` command, or restart.
admins = [
    # "Base58AdminKey1...",
]

# Keys the managed whitelist starts with on first run only. Once a state_file
# exists, runtime changes win and this is ignored.
seed_whitelist = [
    # "Base58PeerKey1...",
]

# How long an issued challenge nonce stays valid, in seconds.
challenge_ttl_secs = 30

# Congestion controller for every connection: "cubic" (squic's default) or
# "bbr". Omit to keep the default.
#
# Measured from a client sixty milliseconds away, Cubic sent one connection
# at under a megabyte a second while the same path carried five over TCP, and
# a four-megabyte picture took seven seconds to arrive. Every connection's
# window, loss and round trip are logged at `info` when it ends
# ("connection ended"), which is where to look before changing this.
# congestion = "bbr"

# SIP-38: names. "off" (the default) does not offer the name routes; "open"
# lets any identity claim a free or lapsed name for its account, reachable as
# name@<domain>; "closed" answers claims with CLOSED and leaves naming to an
# administrator's signed assignment. **An account holds one name at an
# exchange** (SIP-38, 2026-09-21): a second claim is refused while the first
# is held, and a release is the person's step; an administrator's assignment
# is the override. `max_names_per_account`, which once let an operator allow
# more, is refused at load. Names are leased: a beat, a re-claim or a
# publish renews one; `max_names` bounds the whole directory against a
# mint-flood of identities (omit for unlimited).
# name_registration = "off"
# name_lease_secs = 2592000
# max_names = 100000

# ---------------------------------------------------------------------------
# SIP-35: replication.
# ---------------------------------------------------------------------------

# Exchanges this one will serve replication to. Empty means nobody, and the
# peering routes then refuse everyone identically.
#
# Being on this list admits a peer to the routes; what it may pull depends on
# how it is named:
#
#   replication_peers = [
#       "Base58PeerKey",                                    # a full replica
#       { key = "Base58PeerKey", for = ["Base58Account"] },  # acts for accounts
#   ]
#
# A bare key is a **full replica** — one that serves other people's clients. It
# gets a channel only where one of that channel's admins has signed an
# authorisation into the log, because a second operator holding the membership
# graph is a real disclosure and SIP-35 puts that decision with the members.
#
# A peer named with `for` is a **read replica, or somebody's own exchange**
# syncing conversations they are already in. It may pull the channels those
# accounts are present members of, with no per-channel signature — those
# accounts can already fetch every one of those entries as clients, so the copy
# is the same disclosure in a different place.
#
# Note what `for` does not establish: that the peer really is theirs. That is
# this operator's assertion, and a private group's other members did not agree
# to it. See SIP-35 for the account-signed form, which is the stronger one.
# replication_peers = []

# SIP-5 §Durability: the mailbox lives beside the other stores as mailbox.db
# when state_file is set, so a restart keeps every waiting item, its
# collection record and the identifier sequence for the item's TTL. A
# memory-only deployment (no state_file) says `mailbox_durable: false` on
# /status.

# SIP-40 §Lineage: the handovers this exchange has signed, one per line as
# `<domain> <record>` -- `sqexd handover` appends the record it prints, and
# a rotation done before 0.81.0 is added by hand from the TXT value that was
# published. Served at /exchange/lineage so a peer that never held the old
# key can verify what was receipted under it. Defaults to `lineage` beside
# key_file; a missing file means no rotation behind us. The daemon refuses
# to start on a file whose chain does not end at its own key. **Set it when
# key_file is a systemd credential** (/run/credentials/...): the default
# beside the key is then a path nothing writes, and the startup line's
# `lineage_file=` says where the daemon looked.
# lineage_file = "/etc/sqex/lineage"
# lineage_retry_secs = 600

# SIP-35 §Open peering: serve the peering routes to *any* identified caller, listed or not.
# This grants nothing: an unlisted caller may pull, wait on, carry into or be
# told of a channel exactly where a member's signed statement entitles it --
# an admin's authorisation naming its key, or an account's Move naming it as
# home (SIP-59) -- and is refused uniformly everywhere else, as an unlisted
# key is refused today. What it removes is the operator: a home nobody here
# listed can pull for the accounts that chose it, and an origin nobody here
# listed can say it put one of this exchange's accounts in a channel. The
# list above still applies for what only it can grant (`for`). Calls stay
# with SIP-39's peer list. A transport whitelist still closes the door.
# open_peering = false

# SIP-65: ring this exchange's users for, and dial out to, an exchange nobody
# listed -- when the caller's device signed the call and the two people are
# already present members of a conversation held here. The caller's word is
# verified here, not the far exchange's; a stranger exchange can carry a
# call and cannot invent one. Independent of open_peering: a copy costs
# storage a member was entitled to, a ring costs a person's attention.
# Rooms (SIP-39 §Sharing on the relay link) stay with the relay peer list.
# open_calls = false

# ---------------------------------------------------------------------------
# SIP-85: connections carried for members.
#
# A member -- on the whitelist while there is one, a registered device of an
# admitted account (SIP-47), or an account homed here by its Move (SIP-59)
# -- may ask this exchange to carry a transport connection to another
# exchange it names. This exchange resolves the name (SIP-33), refuses unless
# the key it finds is the key the member named, opens a UDP socket towards
# it and copies packets both ways, reading none: the member's own handshake
# with the far exchange runs end to end, and the far exchange sees this
# exchange's address, never the member's. With no whitelist, only the
# accounts homed here are carried for. Off by default; the startup line says
# "tunnel = on (...)" when it is on.
# tunnel = false
# tunnels_per_member = 4          # open at once, per member
# tunnel_bytes_per_sec = 2097152  # each direction, per tunnel; over it, packets drop
# tunnel_idle_secs = 60           # nothing carried either way for this long: closed

# ---------------------------------------------------------------------------
# SIP-39: cross-exchange calls.
# ---------------------------------------------------------------------------

# Exchanges this one will bridge calls to and from, seeded on first run only.
#
# This is the federation boundary, and it is symmetric: this exchange rings a
# local user for an incoming call only from a key on this list, and dials out
# only to a key on this list. Empty means it federates with nobody, brings up
# no relay listener, and refuses every cross-exchange call identically.
#
# **Keys only, no addresses.** Where a peer actually is comes from SIP-33
# discovery of the domain a call names, so a peer that moves is followed rather
# than reconfigured, and there is nothing here to keep in step with DNS.
#
# Like seed_whitelist, this seeds the state file and nothing more. Peers are
# administered at runtime:
#
#     sqex admin peer list
#     sqex admin peer add <base58 exchange key> --label "indra.org"
#     sqex admin peer remove <base58 exchange key>
#
# Those take effect on the next call — no restart, and no interruption to calls
# already bridged. Removing a peer stops the next call; it does not tear down a
# bridge already open.
#
# Renamed from `relay_peers`, which the server now refuses, because a list that
# looked like configuration but was read once and ignored afterwards was worse
# than an error at startup.
seed_relay_peers = [
    # "Base58ExchangeKey1...",
]

# Cap on concurrent bridged calls. Omit for unlimited.
#
# A relay a peer can drive needs a ceiling that a local SIP-12 session does
# not: a local session is already bounded by max_connections, and a bridge is
# its own quantity. A public federating exchange should set one.
#
# Unlike the peer list this is read at startup, so changing it needs a restart.
# max_bridges = 64

# SIP-45: wake-up for devices that cannot hold a stream. A device leaves an
# https:// push endpoint of its own choosing; the exchange posts the word
# `wake` to it, and nothing else, when an event would have gone on a stream
# the device is not holding. Only public https:// endpoints are accepted.
# Set this to also accept http:// to loopback, which the test suite needs and
# a public exchange does not.
# wake_loopback = false

# SIP-48: bytes one account may hold at this exchange as its sealed backup
# (history and keys the exchange cannot read, kept past its own retention).
# Omit for the reference default of 512 MiB. SIP-59 §Collecting the backup: a backup collected
# from an account's former home on its Move counts against the same
# quota; one that would not fit is left where it was and said in the log.
# backup_quota = 536870912

# SIP-35 §Waiting: a replica waits on each origin for its channels to change rather
# than pulling on the interval alone, so a copy is as live as the origin;
# the intervals below (`interval_secs`, `home_secs`) are then the safety
# net -- a full pull that costs what it always cost -- and not the delivery.

# SIP-59: an account that signs this exchange as its home has its channels
# pulled from wherever each lives, and its posts carried back; this is the
# interval between those pulls, in seconds. A move and a post from here
# pull at once regardless. The origins must list this exchange as a
# replication peer, or peer openly (SIP-35 §Open peering), for the pulls to be served.
# home_secs = 30

# SIP-35 §Holding off: an origin that answers a peering write with its limit holds this
# exchange's writes to it for the seconds it gave; a member whose act was
# carried there is answered the origin's limit, or origin_refused where it
# said no, and origin_away only where it did not answer. An origin the home
# task cannot find or reach at all is left alone for a hold that doubles
# with each miss, from home_secs to an hour, and cleared by its first
# answer. Every origin this exchange forwards to, reached, was refused by,
# or an account here hinted at is listed under `origins` in GET /status --
# what it last refused, or that it is unfound, with its count and next try;
# `sqex status` prints them. A hint that stays unfound for hundreds of
# tries is the account's to withdraw (a Move with no origins). Nothing to
# configure.
#
# SIP-60 §Devices of an account that moved: /device/list for an account that lives at another exchange answers
# what its home lists -- whether or not devices of it registered here before
# it moved -- kept a minute; this exchange's own registry only where the
# home cannot be asked. Nothing to configure.
#
# SIP-59 §Collecting wakes: on an account's Move here, its wake registrations (SIP-45) at each
# hinted origin are copied and held for the account, so what arrives here
# wakes its devices before they next connect; an endpoint this exchange's
# own policy (wake_loopback) would refuse is not held. The former home
# keeps its own and goes on waking for the channels it orders.

# SIP-60: a device may tell this exchange, as its home, which origin to
# pull its account's channels from (/account/hint) -- and a create this
# exchange carries elsewhere for an account homed here records the origin
# by itself. Hints are kept 32 per account. Nothing to configure.

# SIP-65 §The member's word: with calls open, a room is shared with an exchange this one does
# not list on a member's word -- the member names the exchange (and its
# domain) in the join and signs for it -- and a share from such an exchange
# is kept when its signer already shares a private channel with a member of
# the room here. Nothing to configure beyond open_calls.

# SIP-60 §A direct message opened twice: on those same pulls, a direct message this exchange already holds
# that an origin also orders is a stray there, and the origin is told to
# fold it -- when the account pulled for is the lower of the two keys, whose
# home the conversation lives at. Folded here, a direct message's log is
# kept seven days for its two members (/channel/folded) and the identifier
# points at the conversation for as long. Nothing to configure.

# SIP-60: the domain this exchange is published under (SIP-33). Told to
# another exchange as the hint to find this one by, when this exchange puts
# one of its accounts in a channel here. Optional: a peer that already
# lists this exchange with a domain label needs no hint.
# domain = "example.com"

# SIP-56: rate limits, per account, on what costs the exchange and its
# members something. Each is [n, seconds]: n in any window of that many
# seconds, refilling steadily; [0, 0] is unlimited. Omitted ones take the
# SIP's defaults, shown here. Reads are never limited.
# [limits]
# posts = [30, 60]        # per channel
# signals = [60, 60]      # per device, per channel
# joins = [20, 3600]
# creates = [10, 3600]
# uploads = [60, 3600]
# reports = [20, 3600]
# peering = [60, 3600]    # SIP-35 §What a stranger can cost: per caller key, the writes a peer causes
# calls = [20, 3600]      # SIP-65: per caller account, cross-exchange calls
# tunnels = [10, 3600]    # SIP-85: per member, tunnels opened (burst 4)
