name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          # The CLI (sqex) depends on sqnr, which links libpcsclite for the
          # YubiKey. Native x86_64 Linux installs it; aarch64 Linux via cross
          # would need it inside the cross image, so it is omitted (build from
          # source there). macOS has PCSC built in. The GUI is not packaged.
          - target: x86_64-unknown-linux-gnu
            archive_target: x86_64-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            archive_target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            archive_target: x86_64-apple-darwin
            os: macos-15-intel

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install PC/SC (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release -p sqexd -p sqex-cli --target ${{ matrix.target }}

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE="sqex-${VERSION}-${{ matrix.archive_target }}.tar.gz"
          BINDIR="target/${{ matrix.target }}/release"
          tar -czf "${ARCHIVE}" -C "${BINDIR}" sqexd sqex
          echo "ARCHIVE=${ARCHIVE}" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: sqex-${{ matrix.archive_target }}
          path: ${{ env.ARCHIVE }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: sqex-*.tar.gz
