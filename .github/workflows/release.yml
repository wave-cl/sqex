name: Release

on:
  push:
    tags:
      - 'v*'
  # A tag push is the normal trigger. This is the way back in when it does not
  # fire — Actions has more than once created no run at all for a pushed tag,
  # and re-cutting the tag is a worse remedy than being able to ask.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release, e.g. v0.9.0'
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # No release from a red main. A tag does not wait for CI, and four releases
  # went out on 2026-09-20 while the snapshot job had been failing since the
  # first of them. This waits for the tagged commit's CI run, in parallel
  # with the build, and the publish step refuses unless it succeeded -- so a
  # broken main costs a tag, not a release.
  # ---------------------------------------------------------------------------
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${REF}" --jq .sha)"
          echo "tag ${REF} is ${sha}"
          # The checks, not the cache: `warm` only fills the release cache
          # and may still be running when everything that tests is green.
          for i in $(seq 1 60); do
            run="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml --commit "${sha}" \
                     --json databaseId --jq '.[0].databaseId' || true)"
            if [ -z "${run}" ]; then
              echo "no CI run for ${sha} yet (${i})"; sleep 20; continue
            fi
            # "<checks> <passed> <failed>": every non-warm job, those that
            # concluded success, those that concluded anything worse.
            read -r checks passed failed <<EOF
          $(gh run view --repo "${GITHUB_REPOSITORY}" "${run}" --json jobs --jq '
              [.jobs[] | select(.name | startswith("warm") | not)]
              | "\(length) \(map(select(.conclusion == "success")) | length) \(map(select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped")) | length)"')
          EOF
            if [ "${failed:-0}" -gt 0 ]; then
              echo "::error::CI failed for ${sha} (${failed} of ${checks} checks); not releasing" >&2; exit 1
            fi
            if [ "${checks:-0}" -gt 0 ] && [ "${passed}" -eq "${checks}" ]; then
              echo "CI checks succeeded for ${sha} (${passed} of ${checks})"; exit 0
            fi
            echo "CI checks: ${passed:-0} of ${checks:-0} passed (${i})"
            sleep 20
          done
          echo "::error::CI did not finish for ${sha} within 20 minutes" >&2
          exit 1

  build:
    strategy:
      matrix:
        include:
          # The CLI (sqex) depends on sqnr, which links libpcsclite for the
          # YubiKey. Native x86_64 Linux installs it; aarch64 Linux via cross
          # would need it inside the cross image, so it is omitted (build from
          # source there). macOS has PCSC built in. The GUI is not packaged.
          # The Intel macOS build was dropped 2026-09-20 (v0.101.4): the
          # slowest runner and the longest queue, for a machine nobody here
          # runs the CLIs on; the exchanges are Linux x86_64.
          - target: x86_64-unknown-linux-gnu
            archive_target: x86_64-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            archive_target: aarch64-apple-darwin
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      # A dispatch can name anything, including a branch, and a run that built
      # `main` would publish a release called `main` with no sign anything was
      # wrong until somebody downloaded it.
      - name: Check it is a version tag
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          case "${VERSION}" in
            v[0-9]*) ;;
            *) echo "refusing to release '${VERSION}': not a version tag" >&2; exit 1 ;;
          esac

      # The tag, whether it came from the push or from the person dispatching.
      # Dispatching builds the tag rather than whatever branch the run was
      # started from, so a manual release cannot quietly ship something else.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Install PC/SC and ALSA (Linux)
        # libpcsclite for sqnr (YubiKey); libasound2 for sqex-voice (cpal).
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # **Read from main, never saved here.** A cache saved by a tag's run is
      # visible only to that tag, so every release built cold. ci.yml's
      # `warm` job builds this same profile and target on these runners on
      # every push to main under this key; `save-if: false` keeps tag runs
      # from filling the quota with caches nothing can read.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.os }}
          save-if: false

      - name: Build
        run: cargo build --release -p sqexd -p sqex-cli -p sqex-chat -p sqex-voice --target ${{ matrix.target }}

      - name: Package
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          ARCHIVE="sqex-${VERSION}-${{ matrix.archive_target }}.tar.gz"
          BINDIR="target/${{ matrix.target }}/release"
          tar -czf "${ARCHIVE}" -C "${BINDIR}" sqexd sqex sqex-chat sqex-voice
          echo "ARCHIVE=${ARCHIVE}" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: sqex-${{ matrix.archive_target }}
          path: ${{ env.ARCHIVE }}

  release:
    # Beside the build, not in front of it: the build and CI run at the same
    # time, and publishing is what waits for both.
    needs: [build, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # Named explicitly, because a dispatched run's ref is not the tag.
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: sqex-*.tar.gz
