name: CI

on:
  push:
  pull_request:
  # Runners were unavailable on 2026-08-26: one push produced no run at all,
  # another was marked startup_failure with the job stuck queued, and a retry
  # concluded "success" having executed zero jobs — a green tick that meant
  # nothing had been compiled or tested. Without a manual trigger there was no
  # way to ask for a real run short of pushing a fresh commit.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # None of the `test` job's setup is repeated here on purpose. rustfmt
      # parses rather than compiles, and `cargo metadata --no-deps` resolves
      # nothing, so this job needs no PC/SC, no ALSA, no cache and no
      # dependency fetch — it answers in seconds while `test` is still
      # installing packages.
      #
      # `--all` would work in this repository: squic is a git dependency and
      # the only path deps (sqex-chat and sqex-voice on sqexd) are workspace
      # members already. The scoped form is used regardless, because `--all`
      # formats the workspace *and the path-based dependencies of its
      # members*, and the day any dependency here is switched to a path
      # outside the workspace, `--all` would start rewriting that checkout
      # unannounced. That is not hypothetical: it is how this repository was
      # accidentally reformatted once, from sigil, which consumes these
      # crates by path.
      #
      # The list is derived rather than written out, so adding a crate cannot
      # leave it silently unchecked, and is echoed so a green run shows what
      # it covered rather than only that nothing failed.
      - name: Format
        run: |
          args=()
          while read -r n; do args+=(-p "$n"); done \
            < <(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name')
          test ${#args[@]} -gt 0
          echo "checking: ${args[*]}"
          cargo fmt "${args[@]}" -- --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # sqnr links libpcsc (via card-backend-pcsc) for YubiKey access, and
      # every crate here depends on sqnr, so this is not optional.
      # macOS has the PCSC framework built in; Linux CI needs the dev package.
      # sqex-voice (the voice demo, not shipped) links ALSA through cpal, and
      # builds libopus from source with cmake, which the runner already has.
      - name: Install PC/SC and ALSA
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # ring builds from source, so an uncached run is slow enough to
      # discourage anyone from waiting on it.
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
