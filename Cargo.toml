[workspace]
resolver = "2"
members = [
    "crates/sqexd",
    "crates/sqex-admin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
squic = { git = "https://github.com/wave-cl/squic-rust", tag = "v0.14.0" }
# sqnr owns the signed-command protocol + PubKey (sqnr-core) and the signer/
# client/CLI (sqnr). Local path deps during active development; switch to a
# pinned git tag (like squic, above) when cutting a release.
sqnr-core = { path = "../sqnr/crates/sqnr-core" }
sqnr = { path = "../sqnr/crates/sqnr" }
tokio = { version = "1", features = ["full"] }
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
bytes = "1"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
bs58 = "0.5"
dirs = "6"
hex = "0.4"
libc = "0.2"
rand = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
