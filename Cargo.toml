[workspace]
resolver = "2"
members = [
    "crates/sqex-proto",
    "crates/sqexd",
    "crates/sqex-cli",
    "crates/sqex-admin",
    "crates/sqex-voice",
    "crates/sqex-chat",
]

[workspace.package]
version = "0.12.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
squic = { git = "https://github.com/wave-cl/squic-rust", tag = "v0.18.0" }
# sqnr owns the signed-command protocol + PubKey (sqnr-core) and the signer/
# client/CLI (sqnr), pinned to a git tag like squic above. For local co-dev,
# override with a [patch] to ../sqnr, or temporarily swap back to path deps.
sqnr-core = { git = "https://github.com/wave-cl/sqnr", tag = "v0.6.0" }
sqnr = { git = "https://github.com/wave-cl/sqnr", tag = "v0.6.0" }
sqex-proto = { path = "crates/sqex-proto" }
tokio = { version = "1", features = ["full"] }
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
bytes = "1"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
bs58 = "0.5"
dirs = "6"
hex = "0.4"
libc = "0.2"
rand = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
