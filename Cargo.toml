[workspace]
resolver = "2"
members = [
    "crates/sqex-proto",
    "crates/sqexd",
    "crates/sqex-cli",
    "crates/sqex-voice",
    "crates/sqex-chat",
    "crates/sqex-discovery",
]

[workspace.package]
version = "0.94.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
squic = { git = "https://github.com/wave-cl/squic-rust", tag = "v0.27.0" }
# sqnr owns the signed-command protocol + PubKey (sqnr-core) and the signer/
# client/CLI (sqnr), pinned to a git tag like squic above. For local co-dev,
# override with a [patch] to ../sqnr, or temporarily swap back to path deps.
sqnr-core = { git = "https://github.com/wave-cl/sqnr", tag = "v0.10.9" }
sqnr = { git = "https://github.com/wave-cl/sqnr", tag = "v0.10.9" }
sqex-proto = { path = "crates/sqex-proto" }
sqex-discovery = { path = "crates/sqex-discovery" }
tokio = { version = "1", features = ["full"] }
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
bytes = "1"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
bs58 = "0.5"
dirs = "6"
hex = "0.4"
libc = "0.2"
rand = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tempfile = "3"
# SIP-33 discovery. The same resolver sqns-client uses, with the same
# features: validation happens locally against the root anchor.
hickory-resolver = { version = "0.26", default-features = false, features = ["dnssec-ring", "system-config", "tokio"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Debug info is the bulk of what a test binary carries, and every test target
# statically links the whole workspace plus its dependency tree. Line tables
# still give file:line in a panic, which is what a backtrace has to be
# readable for; full DWARF is for a debugger, and nothing here is stepped
# through in one.
#
# Measured (2026-09-04, dependencies only): 78.1 MB -> 50.0 MB for a test
# binary on x86_64-unknown-linux-gnu. On macOS split-debuginfo=unpacked keeps
# the debug info out of the binary and in `.rcgu.o` object files that stay in
# target/debug/deps beside it — one set per metadata hash, and a workspace
# built against a path dependency gets a new hash on every edit of it. That
# is how sigil's target reached 343 GB in six days (2026-09-18), and why the
# workspace crates now take line tables too and dependencies none.
#
# profile.test inherits from profile.dev, so this reaches test targets without
# naming them; package."*" restricts the second block to non-workspace crates.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
