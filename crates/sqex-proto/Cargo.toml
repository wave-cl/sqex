[package]
name = "sqex-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "sqex admin command vocabulary: opaque operation payloads + human summaries, over sqnr transactions."

[dependencies]
sqnr-core = { workspace = true }
# Sealing (SIP-5 mailbox). Clients seal and open; sqexd links this but never
# calls it — the exchange handles ciphertext only.
squic = { workspace = true }
x25519-dalek = "2"
ed25519-dalek = { workspace = true }
chacha20poly1305 = "0.10"
sha2 = "0.10"
# SIP-13 room proofs. A keyed hash rolled by hand would probably be fine here;
# HMAC is the version nobody has to check.
hmac = "0.12"
bs58 = { workspace = true }
rand_core = { workspace = true }
hex = { workspace = true }
# The small HTTP/3 client in `h3`, for callers that cannot use `sqnr::Client` —
# a server that must not link libpcsclite, and a hole punch that must choose its
# own local port. See that module for why it exists rather than being reused.
h3 = { workspace = true }
h3-quinn = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
