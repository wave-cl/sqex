[package]
name = "sqex-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Demo: two-party Opus voice over a SIP-12 relayed session, carried on QUIC datagrams."
publish = false

[lib]
name = "sqex_voice"
path = "src/lib.rs"

[[bin]]
name = "sqex-voice"
path = "src/main.rs"

[dependencies]
sqnr = { workspace = true }
sqnr-core = { workspace = true }
sqex-proto = { workspace = true }
sqex-discovery = { workspace = true }
tokio = { workspace = true }
libc = { workspace = true }
clap = { workspace = true }
x25519-dalek = "2"
rand_core = { workspace = true }
rpassword = "7"
# Microphone and speaker: CoreAudio on macOS, ALSA on Linux.
cpal = "0.18"
# The codec. Pulls opusic-sys, whose default `bundled` feature builds libopus
# from source with cmake, so no system libopus is needed.
opus = "0.4"
# WAV in and out, so the demo can be driven and checked without audio hardware.
hound = "3"

[dev-dependencies]
# The integration test runs a whole call against a real exchange in-process.
sqexd = { path = "../sqexd" }
squic = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
toml = { workspace = true }
tempfile = { workspace = true }
