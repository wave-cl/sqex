[package]
name = "sqex-admin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop admin app for sqex (YubiKey-signed commands) — under construction"

[[bin]]
name = "sqex-admin"
path = "src/main.rs"

# Spike: prove the YubiKey OpenPGP Authentication key produces a raw Ed25519
# signature over arbitrary bytes, verifiable by ed25519-dalek. See Phase 5.
[[bin]]
name = "yubikey_spike"
path = "src/bin/yubikey_spike.rs"

[dependencies]
sqex-core = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
bs58 = { workspace = true }
openpgp-card = "0.7"
card-backend-pcsc = "0.5"
secrecy = "0.10"
rpassword = "7"
env_logger = "0.11"
sha1 = "0.10"
