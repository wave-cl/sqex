[package]
name = "sqexd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The sqex exchange server: HTTP/3 over sQUIC with Ed25519 admin authorization"

[[bin]]
name = "sqexd"
path = "src/main.rs"

[dependencies]
sqnr-core = { workspace = true }
sqex-proto = { workspace = true }
squic = { workspace = true }
quinn = { workspace = true }
h3 = { workspace = true }
h3-quinn = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
hex = { workspace = true }
bs58 = { workspace = true }
rand = { workspace = true }
dirs = { workspace = true }
libc = { workspace = true }
tracing = { workspace = true }
# The channel log is the first sqex state that must survive a restart; a
# whole-file rewrite is right for a whitelist and useless for a log. Bundled so
# the three release targets, all native builds, need no system sqlite.
rusqlite = { version = "0.32", features = ["bundled"] }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
x25519-dalek = "2"
rand_core = { workspace = true }
futures = { workspace = true }
# Exercise the real sqnr client + flow + signer against a live server (the CLI's
# own code path). Dependency direction is sqex -> sqnr, which is allowed.
sqnr = { workspace = true }
